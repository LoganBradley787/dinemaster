[project]
name = "dinemaster"
version = "0.1.0"
description = "UVA dining plan tracker"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.38",
    "pandas>=2.2",
    "plotly>=5.24",
    "icalendar>=7.3.0",
    "playwright>=1.63.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
