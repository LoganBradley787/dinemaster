# DineMaster configuration. Every value here is a default; the sidebar can override for a session.

[semester]
start = 2026-08-21        # first day (inclusive)
end = 2026-12-18          # last day (inclusive)
data_cutoff = 2026-08-01  # transactions before this date are ignored in metrics (plan loads post ~08-20)

[plan]
starting_me = 160
starting_dd = 360.0       # $300 base + $60 promotional
meal_price = 15.0         # assumed $ per meal paid in DD
dd_rollover = false       # does unspent DD carry into spring?
dd_leftover_flag = 15.0   # warn if projected DD leftover >= this and rollover is off

[plan.dd_rounding]
mode = "floor"            # floor | round | ceil
granularity = 1.0         # meals; e.g. 0.5 for half-meal precision

[away]
exclude = true            # subtract enabled away periods from remaining days

[[away.periods]]
name = "Thanksgiving recess"
start = 2026-11-25
end = 2026-11-29
enabled = true

[classification]
meal_threshold = 8.0      # DD purchase at a dining spot >= this is a meal; otherwise a snack
# DD purchases at these locations are always snacks (regex, case-insensitive)
snack_patterns = ["Gastons", "Supply 1819", "Vending", "Bodega"]
load_patterns = ["^Deposit$"]          # plan loads / top-ups
adjustment_patterns = ["(?i)revoke"]   # administrative, not usage

[files]
raw_dir = "raw-data"
ledger_path = "data/ledger.csv"
account_regex = "^(?P<account>.+?)_statement"   # applied to file name (without .csv)

[files.columns]
timestamp = "Date"
description = "Description"
amount = "Amount"
balance = "Balance"

# account -> pot; first regex match wins
[[files.pots]]
pattern = "(?i)meal"
pot = "ME"

[[files.pots]]
pattern = "(?i)dining dollars"
pot = "DD"

# "Update data" link generator: paste any URL from the dining site while logged in and the
# app builds one statement link per account (it reuses the session parameters from that URL).
[export]
statement_path = "/statementdetail.php"
session_params = ["cid", "skey"]   # copied from the pasted URL; never stored
start_param = "startdate"
end_param = "enddate"
account_param = "acct"
csv_param = "format=csv"           # added to a statement link to get the CSV file
login_url = "https://connectvirginia.atriumcampus.com/login.php?cid=454"   # enables the Fetch button; delete to turn it off

# name must match the account name in the export file name; acct is the site's account number
[[export.accounts]]
name = "Block 160 Meals"
acct = "22"

[[export.accounts]]
name = "Dining Dollars"
acct = "4"

[[export.accounts]]
name = "Promotional Dining Dollars"
acct = "8"

[[export.accounts]]
name = "Additional Dining Dollars Fall"
acct = "79"

# Day-of-week forecast: each weekday gets its own expected usage, weighted toward recent weeks.
[forecast]
half_life_days = 21     # a day this old counts half as much as yesterday
prior_days = 2.0        # shrinkage: each weekday is pulled toward the overall average as if it had this many extra average days
simulations = 2000      # bootstrap runs behind the likely range
seed = 7
band = [10, 90]         # percentiles reported as the "likely range"

[budget]
max_meals_per_day = 3   # the daily plan never asks for more than this in one day

# Calendar awareness: drop .ics files into ics_dir (or list feed URLs). Events overlapping the
# semester whose title matches away_patterns become away periods; marker_patterns become chart markers.
[calendar]
ics_dir = "calendar"
ics_urls = []
away_patterns = ["(?i)break", "(?i)recess", "(?i)\\bhome\\b", "(?i)\\baway\\b", "(?i)\\btrip\\b"]
marker_patterns = ["(?i)reading day", "(?i)exam", "(?i)finals?\\b"]
cache_hours = 24        # how long a downloaded feed is reused before refetching

[habits]
late_night_start = 21   # hour (24h) when "late night" begins
late_night_end = 4      # hour it ends (next morning)

# Past semesters to compare against (dates are approximate; adjust as needed)
[[history.semesters]]
name = "Fall 2025"
start = 2025-08-21
end = 2025-12-18

[[history.semesters]]
name = "Spring 2026"
start = 2026-01-14
end = 2026-05-09
